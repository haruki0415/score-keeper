<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css"
    />
    <title>卓球得点表</title>
  </head>
  <body>
    <section class="section">
      <div class="container">
        <div class="card">
          <div class="card-content">
            <h1 class="title has-text-centered">
              <span id="p1Display">0</span>
              対
              <span id="p2Display">0</span>
            </h1>
            <div class="field has-text-centered">
              <label for="winningScore">何点先取？</label>
              <div class="select">
                <select id="winningScore">
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
            </div>
            <div class="buttons is-centered">
              <button id="p1Button" class="button is-primary">
                プレイヤー1 +1
              </button>

              <button id="p2Button" class="button is-info">
                プレイヤー2 +1
              </button>
              <button id="reset" class="button is-light">リセット</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
